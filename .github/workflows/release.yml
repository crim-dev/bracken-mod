
name: Build and Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build (e.g. main, legacy-1.21.11)'
        required: true
        default: 'main'
        type: string

  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref }}
          submodules: recursive
          fetch-depth: 0

      - name: Set up environment
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      - name: Verify submodules
        run: |
          echo "Submodule status:"
          git submodule status --recursive

          echo ""
          echo "Directory sizes:"
          du -sh assets/assets datapack/data

          if [ -z "$(find assets/assets -type f -print -quit)" ]; then
            echo "ERROR: assets/assets is empty!"
            exit 1
          fi

          if [ -z "$(find datapack/data -type f -print -quit)" ]; then
            echo "ERROR: datapack/data is empty!"
            exit 1
          fi

      - name: Build mod
        run: ./script/make-mod.sh

      - name: Find generated artifact
        id: artifact
        run: |
          FILE=$(find build -maxdepth 1 -type f -name 'thebrackenpack_dev-*.jar' | head -n 1)

          if [ -z "$FILE" ]; then
            echo "ERROR: No build artifact found!"
            exit 1
          fi

          SIZE=$(stat -c%s "$FILE")

          echo "Generated artifact: $FILE"
          echo "Artifact size: $SIZE bytes"

          if [ "$SIZE" -lt 30000000 ]; then
            echo "ERROR: Artifact is smaller than 30 MB!"
            exit 1
          fi

          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Determine release information
        id: release
        env:
          TARGET_BRANCH: ${{ inputs.branch }}
        run: |
          COMMIT=$(git rev-parse HEAD)

          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            BRANCH="${TARGET_BRANCH//\//-}"
            SHORT_SHA="${COMMIT:0:7}"

            echo "tag=${BRANCH}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "name=${BRANCH}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ steps.release.outputs.commit }}
          name: ${{ steps.release.outputs.name }}
          prerelease: ${{ steps.release.outputs.prerelease }}
          files: ${{ steps.artifact.outputs.file }}
          generate_release_notes: true
          fail_on_unmatched_files: true
